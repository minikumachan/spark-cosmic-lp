# detail は「詳しく見る」で下に開く中身。どれも架空の事例（spark は授業の課題で作った架空のスタジオ）。
- id: ec-rebrand
  title: 次世代ECのブランド刷新
  category: Branding · EC
  shape: shape_blob_gradient_blue
  accent: blue
  alt: 青系のグラデーションブロブで表現したEC刷新プロジェクトのビジュアル
  tags: [Branding, UI/UX]
  desc: 価格の訴求に偏っていた旧サイトを、世界観で選ばれるブランドに作り直しました。ロゴ・トンマナ・購入までの流れを一貫して設計し、回遊と再訪が増える体験にしています。
  detail:
    problem: 値引きの訴求ばかりが目立ち、ブランドの世界観で選ばれていませんでした。
    did: ロゴ・色・書体のガイドラインを作り直し、商品ページから購入までの流れを一つの考え方でそろえました。
    result: 商品を見てから購入するまでの画面を5枚から3枚に減らしました。
    period: 約4か月
    scope: ブランド設計・UI/UXデザイン・実装
    team: ディレクター1名・デザイナー2名・エンジニア2名

- id: saas-dashboard
  title: SaaS管理画面の体験設計
  category: UI/UX · SaaS
  shape: shape_wave_cyan
  accent: cyan
  alt: シアンの波形で表現したSaaSダッシュボードの体験設計ビジュアル
  tags: [UI/UX, Web]
  desc: 機能が多すぎて迷う管理画面を、よく使う作業から逆算した情報設計に組み直しました。デザインシステムを整え、実装の速さと一貫性を両立させています。
  detail:
    problem: 機能が増えすぎて、よく使う操作がどこにあるか分からなくなっていました。
    did: 使う人の作業ごとに画面を組み直し、ボタンや表などの部品をデザインシステムにまとめました。
    result: 部品がそろったことで、新しい画面を作るたびにデザインを一から起こさずに済むようになりました。
    period: 約6か月
    scope: 情報設計・UIデザイン・デザインシステム
    team: ディレクター1名・デザイナー2名

- id: d2c-launch
  title: D2CコスメのローンチLP
  category: Web · D2C
  shape: shape_blob_gradient_coral
  accent: coral
  alt: コーラル系ブロブで表現したD2CコスメのローンチLPビジュアル
  tags: [Web, Branding]
  desc: 発売直後の売れ行きを伸ばすため、世界観に浸れる演出と買いやすさを両立させました。スクロールで物語が進む構成にしながら、表示の速さも落としていません。
  detail:
    problem: 発売に合わせて、世界観を伝えながら迷わず購入できるページが必要でした。
    did: スクロールに合わせて商品の物語が進む構成にし、画像を軽くして表示の速さを保ちました。
    result: 発売日に合わせて公開しました。
    period: 約6週間
    scope: 企画・デザイン・実装
    team: デザイナー1名・エンジニア1名

- id: fintech-app
  title: フィンテックアプリの刷新
  category: UI/UX · Fintech
  shape: shape_squiggle_purple
  accent: purple
  alt: 紫の曲線で表現したフィンテックアプリ刷新のビジュアル
  tags: [UI/UX]
  desc: お金を扱うアプリに欠かせない安心感を、迷わない操作の流れと誠実な文言で作り直しました。アクセシビリティを前提に、誰でも安心して使える画面にしています。
  detail:
    problem: お金を扱うアプリなのに、操作の途中で不安を感じる場面が多くありました。
    did: 送金と確認の流れを見直し、画面の文言を一つずつ書き直しました。アクセシビリティの基準は最初から取り入れています。
    result: 送金の手順を1本の流れにまとめました。
    period: 約5か月
    scope: UI/UXデザイン・UXライティング
    team: ディレクター1名・デザイナー2名・ライター1名

- id: corporate-site
  title: コーポレートサイト構築
  category: Web · Corporate
  shape: shape_soft_square_layer
  accent: green
  alt: グリーンのソフトな四角レイヤーで表現したコーポレートサイトのビジュアル
  tags: [Web]
  desc: 採用と会社の信頼を担うコーポレートサイトを、SEO・表示の速さ・更新のしやすさを満たす土台で構築しました。社内で更新しやすい作りにして、公開後の成長を支えています。
  detail:
    problem: 採用と会社の信頼を伝えるサイトが古く、更新にも時間がかかっていました。
    did: 検索で見つかりやすい作りにし、社内の担当者が自分で記事を更新できる仕組みにしました。
    result: 記事の更新を社内だけで行えるようになりました。
    period: 約3か月
    scope: 設計・デザイン・実装・公開後の保守
    team: ディレクター1名・デザイナー1名・エンジニア1名

- id: event-world
  title: イベントの世界観設計
  category: Creative · Event
  shape: shape_pill_lime
  accent: lime
  alt: ライムのピル形状で表現したイベント世界観設計のビジュアル
  tags: [Creative Direction]
  desc: 告知から当日まで一貫した世界観を、キービジュアルとモーションで作りました。SNSで広がり、記憶に残るイベントになるようディレクションしています。
  detail:
    problem: 告知・会場・SNSで見た目がばらばらで、同じイベントに見えませんでした。
    did: キービジュアルとモーションのルールを作り、告知から当日の会場まで同じ世界観でそろえました。
    result: 告知の画像・会場の映像・SNSの投稿を、同じルールで作れるようにしました。
    period: 約2か月
    scope: クリエイティブディレクション・キービジュアル・映像
    team: ディレクター1名・デザイナー2名
